<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة أجهزة - النسخة الملكية</title>
    <link rel="icon" href="IMG/RR.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --clr-shrah: rgb(255, 79, 79);
            --clr-mozakrat: rgb(97, 255, 76);
            --clr-books: #fcff32;
            --clr-exams: #b5ffdf;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: #fff; margin: 0; overflow-x: hidden;
            min-height: 100vh;
        }

        #bgCanvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
        }

        header { padding: 50px 20px; text-align: center; }
        .main-logo {
            width: 120px; height: auto;
            filter: drop-shadow(0 0 20px var(--gold-glow));
            margin-bottom: 15px;
        }
        header h1 { 
            font-size: 2.5rem; margin: 0; font-weight: 900;
            background: linear-gradient(to bottom, #fff, var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .container { padding: 15px; max-width: 450px; margin: auto; }

        .subject-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 30px; padding: 25px; margin-bottom: 25px;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }
        .subject-card:active { transform: scale(0.98); border-color: var(--gold); }

        .card-header h3 { font-size: 1.5rem; margin: 0 0 15px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-item { 
            padding: 12px; border-radius: 18px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05); text-align: center;
        }
        .stat-num { font-size: 1.8rem; font-weight: 900; display: block; }
        .stat-label { font-size: 0.7rem; opacity: 0.5; }

        /* الألوان المميزة */
        .shrah { color: var(--clr-shrah); }
        .mozakrat { color: var(--clr-mozakrat); }
        .books { color: var(--clr-books); }
        .exams { color: var(--clr-exams); }

        .modal { 
            display: none; position: fixed; inset: 0; z-index: 9999; 
            background: rgba(0,0,0,0.95); backdrop-filter: blur(20px);
        }
        .modal-content { padding: 30px; }
        .btn-luxury {
            width: 100%; padding: 35px; margin-bottom: 12px; border-radius: 20px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(212, 175, 55, 0.2); 
            color: #fff; font-weight: 700; display: flex; justify-content: space-between; align-items: center;
        }
        .item-card {
            background: rgba(255,255,255,0.04); padding: 18px; border-radius: 20px;
            margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1);
        }
        .action-btns { display: flex; gap: 8px; margin-top: 12px; }
        .view-btn, .download-btn { flex: 1; padding: 10px; border-radius: 10px; text-decoration: none; text-align: center; color: #000; font-weight: 900; font-size: 0.8rem; }
        .view-btn { background: #fff; }
        .download-btn { background: var(--gold); }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<header>
    <img src="IMG/RR.png" alt="Logo" class="main-logo">
    <h1>مكتبة أجهزة</h1>
    <p style="color: var(--gold); opacity: 0.8;">الصف الثاني - الترم الثاني</p>
</header>

<div class="container" id="subjectsGrid"></div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span style="font-size: 30px; color: var(--gold); cursor: pointer;" onclick="closeModal()">✕</span>
        <h2 id="modalTitle" style="color: var(--gold); margin: 20px 0; text-align: center;"></h2>
        <div id="mainOptions">
            <button class="btn-luxury" onclick="showSubSection('shrah')">🎬 فيديوهات الشرح <span class="shrah">❯</span></button>
            <button class="btn-luxury" onclick="showSubSection('mozakrat')">📜 المذكرات <span class="mozakrat">❯</span></button>
            <button class="btn-luxury" onclick="showSubSection('books')">📚 الكتب <span class="books">❯</span></button>
            <button class="btn-luxury" onclick="showSubSection('exams')">✍️ امتحانات <span class="exams">❯</span></button>
        </div>
        <div id="subSection" style="display: none;">
            <button class="btn-luxury" onclick="backToMain()" style="background: var(--gold); color: #000;">🔙 رجوع</button>
            <div id="itemsList"></div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let width, height;

    function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        for(let i=0; i<80; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                r: Math.random() * 2 + 1
            });
        }
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "rgba(212, 175, 55, 0.5)";
        
        particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;

            if(p.x < 0 || p.x > width) p.vx *= -1;
            if(p.y < 0 || p.y > height) p.vy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fill();

            // رسم الخطوط عند الاقتراب
            for(let j=i+1; j<particles.length; j++) {
                let p2 = particles[j];
                let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                if(dist < 100) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(212, 175, 55, ${1 - dist/100})`;
                    ctx.lineWidth = 0.5;
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            }
        });
        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', init);
    init();
    draw();

    // نظام البيانات
    const libraryData = {
        "PLC (متحكمات مبرمجة)": { shrah: [], mozakrat: [], books: [], exams: [] },
        "KAB (مشروع وثقافة العمل)": { shrah: [], mozakrat: [], books: [], exams: [] },
        "صيانة أجهزة إلكترونية": { shrah: [], mozakrat: [], books: [], exams: [] },
        "إتصالات": { shrah: [], mozakrat: [], books: [], exams: [] },
        "معامل تطبيقية": { shrah: [], mozakrat: [], books: [], exams: [] },
        "تقارير فنية": { shrah: [], mozakrat: [], books: [], exams: [] },
        "دوائر متقدمة": { shrah: [], mozakrat: [], books: [], exams: [] },
    };

    function renderCards() {
        const grid = document.getElementById('subjectsGrid');
        grid.innerHTML = "";
        for (let sub in libraryData) {
            const d = libraryData[sub];
            grid.innerHTML += `
                <div class="subject-card" onclick="openModal('${sub}')">
                    <div class="card-header"><h3>${sub}</h3></div>
                    <div class="stats-grid">
                        <div class="stat-item shrah"><span class="stat-num">${d.shrah.length}</span><span class="stat-label">شرح</span></div>
                        <div class="stat-item mozakrat"><span class="stat-num">${d.mozakrat.length}</span><span class="stat-label">مذكرات</span></div>
                        <div class="stat-item books"><span class="stat-num">${d.books.length}</span><span class="stat-label">كتب</span></div>
                        <div class="stat-item exams"><span class="stat-num">${d.exams.length}</span><span class="stat-label">امتحان</span></div>
                    </div>
                </div>`;
        }
    }

    let currentSub = "";
    function openModal(n) {
        currentSub = n;
        document.getElementById('modalTitle').innerText = n;
        document.getElementById('modal').style.display = 'block';
        backToMain();
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function backToMain() { document.getElementById('mainOptions').style.display = 'block'; document.getElementById('subSection').style.display = 'none'; }
    function showSubSection(t) {
        document.getElementById('mainOptions').style.display = 'none';
        document.getElementById('subSection').style.display = 'block';
        const list = document.getElementById('itemsList');
        list.innerHTML = "<p style='text-align:center; opacity:0.5;'>قريباً...</p>";
    }

    renderCards();
</script>
</body>
</html>
