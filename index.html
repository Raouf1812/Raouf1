<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة أجهزة - الإصدار الملكي</title>
    <link rel="icon" href="IMG/RR.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --gold: #a8cad7; 
            --gold-glow: rgba(168, 202, 215, 0.2);
            --clr-shrah: #ff4b2b;
            --clr-mozakrat: #00f260;
            --clr-books: #fcff32;
            --clr-exams: #b5ffdf;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: #fff;
            margin: 0; overflow-x: hidden;
            min-height: 100vh;
        }
                /* تأثير اللمعة المتحركة على الكروت */
        .subject-card, .memo-card {
            position: relative;
            overflow: hidden; /* لمنع اللمعة من الخروج عن حدود الكارت */
        }
                /* تأثير الزجاج اللامع */
        .subject-card, .memo-card {
            position: relative;
            overflow: hidden;
        }
        .subject-card::before, .memo-card::before {
            content: "";
            position: absolute;
            top: 0; left: -150%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: skewX(-25deg);
            transition: 0.8s;
        }
        .subject-card:hover::before, .memo-card:hover::before { left: 150%; }

        /* تنسيق عداد الزوار المطور */
        .footer-stats {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-badge {
            background: rgba(168, 202, 215, 0.08);
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(168, 202, 215, 0.2);
            font-size: 0.85rem;
        }
        .online-now::before {
            content: "";
            width: 8px; height: 8px;
            background: #00f260;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f260;
            animation: pulse-dot 1.5s infinite;
        }
        @keyframes pulse-dot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .subject-card::before, .memo-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transform: skewX(-25deg);
            transition: 0.8s;
        }

        .subject-card:hover::before, .memo-card:hover::before {
            left: 150%; /* تحرك اللمعة من اليمين لليسار عند التمرير */
        }

        #welcome-screen {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        #toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: var(--gold); color: #000; padding: 15px 25px;
            border-radius: 50px; font-weight: 900; z-index: 10001;
            transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); white-space: nowrap;
        }

        #bgCanvas { position: fixed; top: 0; left: 0; z-index: -1; background: #050505; }

        header { padding: 40px 20px; text-align: center; position: relative; z-index: 10; }
        .main-logo { width: 100px; filter: drop-shadow(0 0 15px var(--gold-glow)); margin-bottom: 10px; }
        header h1 { font-size: 2.2rem; margin: 0; color: var(--gold); font-weight: 900; text-shadow: 0 0 10px var(--gold-glow); }

        .container { padding: 15px; max-width: 450px; margin: auto; position: relative; z-index: 10; }

        .subject-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px; padding: 20px; margin-bottom: 20px;
            backdrop-filter: blur(10px); transition: 0.3s;
        }
        .subject-card:active { transform: scale(0.96); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .stat-item { padding: 10px; border-radius: 15px; background: rgba(0,0,0,0.3); text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-num { font-size: 1.5rem; font-weight: 900; display: block; }
        .stat-label { font-size: 0.7rem; opacity: 0.6; }

        /* تنسيق كارت الملف الجديد */
        .memo-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px; margin-bottom: 15px; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .memo-header-area {
            display: flex; justify-content: space-between; align-items: flex-start; padding: 15px;
        }
        .memo-title-side { flex: 1; text-align: right; }
        .memo-name { display: block; font-weight: 700; font-size: 1rem; color: var(--gold); }
        .memo-count-side {
            background: rgba(168, 202, 215, 0.15);
            padding: 5px 12px; border-radius: 12px;
            font-size: 0.75rem; color: var(--gold);
            white-space: nowrap; margin-right: 10px;
            border: 1px solid rgba(168, 202, 215, 0.2);
        }

        .memo-actions { display: flex; gap: 8px; padding: 12px; background: rgba(0,0,0,0.3); }
        .btn { flex: 1; padding: 12px; border-radius: 12px; text-align: center; text-decoration: none; font-weight: 800; font-size: 0.85rem; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.3s; }
        .btn-watch { background: var(--clr-shrah); color: #fff; }
        .btn-open { background: #fff; color: #000; }
        .btn-dl { background: var(--gold); color: #000; }

        .modal { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0, 0, 0, 0.98); backdrop-filter: blur(25px); overflow-y: auto; }
        .modal-content { padding: 25px; max-width: 500px; margin: auto; }
        .close-modal { font-size: 30px; color: var(--gold); cursor: pointer; display: block; margin-bottom: 10px; }
        .btn-luxury { width: 100%; padding: 25px; margin-bottom: 10px; border-radius: 18px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; font-weight: 700; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: none; font-family: 'Cairo'; }

        .shrah { color: var(--clr-shrah); }
        .mozakrat { color: var(--clr-mozakrat); }
        .books { color: var(--clr-books); }
        .exams { color: var(--clr-exams); }

        footer { margin-top: 50px; padding: 40px 20px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        footer span { color: var(--gold); font-weight: 900; }

        .visitor-counter {
                margin-bottom: 15px;
                background: rgba(168, 202, 215, 0.08);
                padding: 10px 25px;
                border-radius: 50px;
                display: inline-flex;
                align-items: center;
                gap: 12px;
                border: 1px solid rgba(168, 202, 215, 0.2);
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            }

            /* دائرة النبض الخضراء */
            .visitor-counter::before {
                content: "";
                width: 8px;
                height: 8px;
                background: #00f260;
                border-radius: 50%;
                display: inline-block;
                box-shadow: 0 0 10px #00f260;
                animation: pulse-dot 1.5s infinite;
            }

            @keyframes pulse-dot {
                0% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.5); opacity: 0.5; }
                100% { transform: scale(1); opacity: 1; }
            }

            #global-visitors {
                letter-spacing: 1px;
                text-shadow: 0 0 5px var(--gold-glow);
            }
            #online-count, #total-visitors {
    transition: all 0.5s ease;
    display: inline-block;
    min-width: 20px;
}
    </style>
</head>
<body>

<div id="welcome-screen">
    <img src="IMG/RR.png" alt="Logo" style="width: 100px;">
    <h2 style="color: var(--gold); margin-top: 20px; font-weight: 900;">مرحباً بك</h2>
</div>

<div id="toast">جاري تحميل الملف.. ستجده في التحميلات 📂</div>
<canvas id="bgCanvas"></canvas>

<header>
    <img src="IMG/RR.png" alt="Logo" class="main-logo">
    <h1>مكتبة أجهزة</h1>
</header>

<div class="container" id="subjectsGrid"></div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">✕</span>
        <h2 id="modalTitle" style="color: var(--gold); margin: 10px 0 25px; text-align: center;"></h2>
        <div id="mainOptions">
            <button class="btn-luxury" onclick="showSubSection('shrah')">🎬 فيديوهات الشرح <span class="shrah">❯</span></button>
            <button class="btn-luxury" onclick="showSubSection('mozakrat')">📜 المذكرات <span class="mozakrat">❯</span></button>
            <button class="btn-luxury" onclick="showSubSection('books')">📚 الكتب <span class="books">❯</span></button>
            <button class="btn-luxury" onclick="showSubSection('exams')">✍️ امتحانات <span class="exams">❯</span></button>
        </div>
        <div id="subSection" style="display: none;">
            <button class="btn-luxury" onclick="backToMain()" style="background: var(--gold); color: #000; padding: 15px; margin-bottom: 25px;">🔙 العودة للقائمة</button>
            <div id="itemsList"></div>
        </div>
    </div>
</div>

<footer>

    <div class="footer-stats">
        <div class="stat-badge">
        <span>👥 عدد الزيارات الكلي :</span>
        <span id="total-visitors">جارِ التحميل...</span>
    </div>
    </div>
    <p>تم التطوير بواسطة <span>RR</span></p>

</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
    import { getDatabase, ref, runTransaction, onValue, onDisconnect, set, push } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADtj_iYU1wn3kBaaPfXTqMqEAClVJRVNE",
      authDomain: "raouf-68d9e.firebaseapp.com",
      databaseURL: "https://raouf-68d9e-default-rtdb.firebaseio.com",
      projectId: "raouf-68d9e",
      storageBucket: "raouf-68d9e.firebasestorage.app",
      messagingSenderId: "390151395077",
      appId: "1:390151395077:web:993860d19c10650cc1496c",
      measurementId: "G-VSZ31FMZGD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- 1. عداد إجمالي الزيارات (ذكي لا يتأثر بالريفريش) ---
    const totalRef = ref(db, 'stats/total_visitors');
    if (!sessionStorage.getItem('total_counted')) {
        runTransaction(totalRef, (curr) => (curr || 0) + 1);
        sessionStorage.setItem('total_counted', 'true');
    }
    onValue(totalRef, (snap) => {
        const el = document.getElementById('total-visitors');
        if(el) el.innerText = snap.val() || 0;
    });

    // --- 2. عداد المتواجدون الآن (حل مشكلة الريفريش) ---
    const onlineRef = ref(db, 'stats/online_now');
    
    // نستخدم sessionStorage لحفظ مفتاح الجلسة لكي لا يحسبك شخصاً جديداً عند كل ريفريش
    let sessionKey = sessionStorage.getItem('presence_key');
    let presenceRef;

    if (sessionKey) {
        presenceRef = ref(db, 'stats/presence/' + sessionKey);
    } else {
        const newRef = push(ref(db, 'stats/presence/'));
        sessionKey = newRef.key;
        sessionStorage.setItem('presence_key', sessionKey);
        presenceRef = newRef;
    }

    onValue(ref(db, '.info/connected'), (snap) => {
        if (snap.val() === true) {
            // التحقق إذا كان المستخدم مسجلاً بالفعل لتجنب التكرار عند الريفريش
            onValue(presenceRef, (pSnap) => {
                if (!pSnap.exists()) {
                    set(presenceRef, true);
                    runTransaction(onlineRef, (curr) => (curr || 0) + 1);
                }
            }, { onlyOnce: true });

            // المسح عند إغلاق المتصفح نهائياً
            onDisconnect(presenceRef).remove();
            onDisconnect(onlineRef).runTransaction((curr) => (curr || 0) - 1);
        }
    });

    onValue(onlineRef, (snap) => {
        const val = snap.val();
        const display = document.getElementById('online-count');
        if(display) display.innerText = (val && val > 0) ? val : 1;
    });

    // --- 3. عداد التحميلات ---
    window.updateDL = (id) => {
        if(!id) return;
        runTransaction(ref(db, 'counts/' + id), (curr) => (curr || 0) + 1);
    };

    window.syncCounts = () => {
        onValue(ref(db, 'counts/'), (snap) => {
            const data = snap.val(); if(!data) return;
            for(let id in data) {
                const el = document.getElementById('c-'+id);
                if(el) el.innerText = "تم التحميل " + data[id] + " مرة";
            }
        });
    };
</script>

<script>
    const libraryData = {
        "PLC (متحكمات مبرمجة)": { 
            shrah: [], 
            mozakrat: [{ id: "plc_qwesna", title: "مذكرة plc معهد قويسنا", link: "PDF/PLC/مذكرة plc معهد قويسنا .pdf" }],
            books: [], 
            exams: [] 
        },
        "صيانة وإصلاح أجهزة إلكترونية": { shrah: [], mozakrat: [], books: [], exams: [] },
        "إتصالات": { shrah: [], mozakrat: [], books: [], exams: [] },
        "KAB (مشروع وثقافة العمل الحر )": { shrah: [], mozakrat: [], books: [], exams: [] },
        "معامل تطبيقية": { shrah: [], mozakrat: [], books: [] },
        "تقارير فنية": { shrah: [], mozakrat: [], books: [] },
        "دوائر متقدمة": { shrah: [], mozakrat: [], books: [] },
    };

    // نظام الجزيئات
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let width, height;

    function initCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        for(let i=0; i<80; i++) {
            particles.push({ x: Math.random()*width, y: Math.random()*height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5, size: Math.random()*2+1 });
        }
    }
    function drawCanvas() {
        ctx.clearRect(0,0,width,height);
        ctx.fillStyle = "rgba(168, 202, 215, 0.3)";
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy;
            if(p.x<0 || p.x>width) p.vx*=-1; if(p.y<0 || p.y>height) p.vy*=-1;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            for(let j=i+1; j<particles.length; j++){
                let p2 = particles[j]; let d = Math.hypot(p.x-p2.x, p.y-p2.y);
                if(d<120){ ctx.beginPath(); ctx.strokeStyle=`rgba(168,202,215,${0.3-d/120})`; ctx.moveTo(p.x,p.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
            }
        });
        requestAnimationFrame(drawCanvas);
    }
    window.addEventListener('resize', initCanvas);
    initCanvas(); drawCanvas();

    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('welcome-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('welcome-screen').style.display = 'none', 500);
        }, 800); 
    });

    let currentSub = "";
    function renderCards() {
        const grid = document.getElementById('subjectsGrid');
        grid.innerHTML = "";
        for (let sub in libraryData) {
            const d = libraryData[sub];
            grid.innerHTML += `<div class="subject-card" onclick="openModal('${sub}')"><h3 style="margin:0; font-size:1.3rem; color:var(--gold);">${sub}</h3><div class="stats-grid"><div class="stat-item shrah"><span class="stat-num">${d.shrah.length}</span><span class="stat-label">شرح</span></div><div class="stat-item mozakrat"><span class="stat-num">${d.mozakrat.length}</span><span class="stat-label">مذكرات</span></div><div class="stat-item books"><span class="stat-num">${d.books.length}</span><span class="stat-label">كتب</span></div><div class="stat-item exams"><span class="stat-num">${d.exams ? d.exams.length : 0}</span><span class="stat-label">امتحان</span></div></div></div>`;
        }
    }

    function openModal(n) { currentSub = n; document.getElementById('modalTitle').innerText = n; document.getElementById('modal').style.display = 'block'; backToMain(); }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function backToMain() { document.getElementById('mainOptions').style.display = 'block'; document.getElementById('subSection').style.display = 'none'; }

    async function showSubSection(t) {
        document.getElementById('mainOptions').style.display = 'none';
        document.getElementById('subSection').style.display = 'block';
        const list = document.getElementById('itemsList');
        const items = libraryData[currentSub][t] || [];
        if(items.length === 0) { list.innerHTML = "<div style='text-align:center; padding:40px; opacity:0.3;'>لا يوجد محتوى حالياً</div>"; return; }

        let content = "";
        for (const item of items) {
            if (t === 'shrah') {
                content += `<div class="memo-card"><div class="memo-header-area"><div class="memo-title-side"><span class="memo-name">${item.title}</span></div></div><div class="memo-actions"><a href="${item.link}" target="_blank" class="btn btn-watch">👁️ مشاهدة</a></div></div>`;
            } else {
                content += `
                <div class="memo-card">
                    <div class="memo-header-area">
                        <div class="memo-title-side">
                            <span class="memo-name">${item.title}</span>
                            <small style="opacity:0.5">حجم: 1.5 MB</small>
                        </div>
                        <div class="memo-count-side" id="c-${item.id || 'none'}"> تم التحميل 0 مره</div>
                    </div>
                    <div class="memo-actions">
                        <a href="${item.link}" target="_blank" class="btn btn-open">👁️ فتح</a>
                        <button onclick="triggerDownload('${item.link}', '${item.title}'); if(window.updateDL) window.updateDL('${item.id}')" class="btn btn-dl">📥 تحميل</button>
                    </div>
                </div>`;
            }
        }
        list.innerHTML = content;
        if(window.syncCounts) window.syncCounts();
    }

    function triggerDownload(url, filename) {
        const toast = document.getElementById('toast');
        toast.style.bottom = '30px'; setTimeout(() => toast.style.bottom = '-100px', 3000);
        const link = document.createElement('a'); link.href = url; link.download = filename; document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    renderCards();
</script>
</body>
</html>
