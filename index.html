<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ويطول البعد</title>
    <style>
        /* استدعاء خط تجوال للأرقام والعداد، وخط أميري كلاسيكي للكلمة المزخرفة */
        @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@200;300;400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            background-color: #030305; 
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .ambient-light {
            position: absolute;
            width: 60vw;
            height: 20vw;
            background: radial-gradient(ellipse at center, rgba(30, 35, 50, 0.2) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* الكلمة المزخرفة فوق العداد */
        .title-text {
            position: relative;
            z-index: 1;
            font-family: 'Amiri', serif; /* خط كلاسيكي شاعري ومزخرف */
            font-size: 2.8rem;
            font-weight: 700;
            
            /* لون الكلمة من جوه */
            color: rgba(255, 255, 255, 0.03); 
            
            /* لون الحواف */
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.25);
            
            word-spacing: 5px; /* مسافات بين الكلمات بدل الحروف عشان متتقطعش */
            margin-bottom: 35px; 
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.03);
            user-select: none; 
        }

        .glass-rectangle {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: row; 
            flex-wrap: nowrap;
            justify-content: space-evenly;
            align-items: center;
            width: 80%;
            max-width: 900px;
            padding: 2.5rem 3rem;
            background: linear-gradient(135deg, rgba(20, 20, 25, 0.4), rgba(5, 5, 10, 0.2));
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 16px; 
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(0, 0, 0, 0.8);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.8), 
                inset 0 1px 15px rgba(255, 255, 255, 0.02); 
        }

        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .number {
            font-size: 5rem;
            font-weight: 300;
            color: rgba(220, 220, 230, 0.8);
            text-shadow: 
                0 0 10px rgba(100, 110, 140, 0.2),
                0 0 20px rgba(100, 110, 140, 0.1);
            letter-spacing: 2px;
            font-family: 'Courier New', Courier, monospace; 
        }

        .text {
            margin-top: 10px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1px;
        }

        .divider {
            font-size: 4rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.05);
            padding-bottom: 30px;
        }

        /* تظبيط مقاسات الموبايل */
        @media (max-width: 768px) {
            .title-text {
                font-size: 1.6rem;
                margin-bottom: 25px;
                -webkit-text-stroke: 0.8px rgba(255, 255, 255, 0.25); 
            }
            .glass-rectangle {
                width: 95%;
                padding: 1.5rem 1rem;
            }
            .number {
                font-size: 2.2rem; 
            }
            .text {
                font-size: 0.65rem;
                margin-top: 5px;
            }
            .divider {
                font-size: 2rem;
                padding-bottom: 15px;
            }
        }
        
        @media (max-width: 400px) {
            .title-text {
                font-size: 1.3rem;
            }
            .glass-rectangle {
                padding: 1rem 0.5rem;
            }
            .number {
                font-size: 1.8rem; 
            }
            .text {
                font-size: 0.55rem;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>
    
    <!-- الكلمة المزخرفة -->
    <div class="title-text">وَيطُـــولُ البُعْــدُ... وَتَزْدَادُ المَسَـــافَات</div>

    <div class="glass-rectangle">
        <div class="time-block">
            <span class="number" id="days">0</span>
            <span class="text">أيام</span>
        </div>
        <div class="divider">:</div>
        <div class="time-block">
            <span class="number" id="hours">00</span>
            <span class="text">ساعات</span>
        </div>
        <div class="divider">:</div>
        <div class="time-block">
            <span class="number" id="minutes">00</span>
            <span class="text">دقائق</span>
        </div>
        <div class="divider">:</div>
        <div class="time-block">
            <span class="number" id="seconds">00</span>
            <span class="text">ثواني</span>
        </div>
    </div>

    <script>
        // التاريخ: 18 فبراير 2026 
        // شهر فبراير رقمه 1 في لغة الجافاسكريبت
        const startDate = new Date(2026, 1, 18, 0, 0, 0).getTime();

        function updateCounter() {
            const now = new Date().getTime();
            const timeDiff = now - startDate;

            if (timeDiff > 0) {
                const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);

                // الأيام بتظهر زي ما هي
                document.getElementById('days').textContent = days.toString();
                
                // الساعات والدقائق والثواني دايماً رقمين
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            }
        }

        setInterval(updateCounter, 1000);
        updateCounter(); 
    </script>

</body>
</html>

    </script>

</body>
</html>
