<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة أجهزة - النسخة الاحترافية</title>
    <link rel="icon" href="IMG/RR.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --clr-shrah: rgb(255, 79, 79);
            --clr-mozakrat: rgb(97, 255, 76);
            --clr-books: #fcff32;
            --clr-exams: #b5ffdf;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: #fff; margin: 0; overflow-x: hidden;
            min-height: 100vh;
        }

        #bgCanvas { position: fixed; top: 0; left: 0; z-index: -1; }

        header { padding: 40px 20px; text-align: center; position: relative; z-index: 10; }
        .main-logo { width: 110px; filter: drop-shadow(0 0 15px var(--gold-glow)); margin-bottom: 10px; }
        header h1 { font-size: 2.2rem; margin: 0; background: linear-gradient(to bottom, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .container { padding: 15px; max-width: 450px; margin: auto; position: relative; z-index: 10; }

        /* الكروت الرئيسية للمواد */
        .subject-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 25px; padding: 20px; margin-bottom: 20px;
            backdrop-filter: blur(10px); transition: 0.3s;
        }
        .subject-card:active { transform: scale(0.96); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .stat-item { padding: 10px; border-radius: 15px; background: rgba(0,0,0,0.3); text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-num { font-size: 1.5rem; font-weight: 900; display: block; }
        .stat-label { font-size: 0.7rem; opacity: 0.6; }

        /* تنسيق كروت المذكرات (البريفيوز) */
        .memo-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px; margin-bottom: 15px; overflow: hidden;
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .memo-preview {
            height: 100px; background: linear-gradient(45deg, #111, #222);
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .file-icon { width: 45px; height: 55px; background: #fff; border-radius: 4px; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        .file-icon::after { content: "PDF"; position: absolute; bottom: 4px; right: 4px; font-size: 9px; color: #ff4f4f; font-weight: 900; }

        .memo-details { padding: 15px; }
        .memo-name { display: block; font-weight: 700; font-size: 1rem; color: #fff; margin-bottom: 4px; }
        .memo-info { font-size: 0.75rem; color: var(--gold); opacity: 0.7; }

        .memo-actions { display: flex; gap: 8px; padding: 12px; background: rgba(0,0,0,0.2); }
        .btn-open, .btn-dl { flex: 1; padding: 10px; border-radius: 10px; text-align: center; text-decoration: none; font-weight: 800; font-size: 0.8rem; }
        .btn-open { background: #fff; color: #000; }
        .btn-dl { background: var(--gold); color: #000; }

        /* المودال */
        .modal { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); overflow-y: auto; }
        .modal-content { padding: 25px; max-width: 500px; margin: auto; }
        .btn-luxury { width: 100%; padding: 25px; margin-bottom: 10px; border-radius: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(212, 175, 55, 0.2); color: #fff; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }

        .shrah { color: var(--clr-shrah); }
        .mozakrat { color: var(--clr-mozakrat); }
        .books { color: var(--clr-books); }
        .exams { color: var(--clr-exams); }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<header>
    <img src="IMG/RR.png" alt="Logo" class="main-logo">
    <h1>مكتبة أجهزة</h1>
    <p style="font-size: 0.9rem; opacity: 0.7;">الصف الثاني - الترم الثاني</p>
</header>

<div class="container" id="subjectsGrid"></div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span style="font-size: 30px; color: var(--gold); cursor: pointer;" onclick="closeModal()">✕</span>
        <h2 id="modalTitle" style="color: var(--gold); margin: 20px 0; text-align: center; font-size: 1.4rem;"></h2>
        
        <div id="mainOptions">
            <button class="btn-luxury" onclick="showSubSection('shrah')">🎬 فيديوهات الشرح <span class="shrah">❯</span></button>
            <button class="btn-luxury" onclick="showSubSection('mozakrat')">📜 المذكرات <span class="mozakrat">❯</span></button>
            <button class="btn-luxury" onclick="showSubSection('books')">📚 الكتب <span class="books">❯</span></button>
            <button class="btn-luxury" onclick="showSubSection('exams')">✍️ امتحانات <span class="exams">❯</span></button>
        </div>

        <div id="subSection" style="display: none;">
            <button class="btn-luxury" onclick="backToMain()" style="background: var(--gold); color: #000; padding: 15px;">🔙 رجوع للرئيسية</button>
            <div id="itemsList"></div>
        </div>
    </div>
</div>

<script>
    // --- الخلفية الشبكية الهادئة ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let width, height;

    function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        for(let i=0; i<60; i++) {
            particles.push({ x: Math.random()*width, y: Math.random()*height, vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4 });
        }
    }

    function draw() {
        ctx.fillStyle = "#050505"; ctx.fillRect(0,0,width,height);
        ctx.fillStyle = "rgba(212, 175, 55, 0.4)";
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy;
            if(p.x<0 || p.x>width) p.vx*=-1; if(p.y<0 || p.y>height) p.vy*=-1;
            ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
            for(let j=i+1; j<particles.length; j++){
                let p2 = particles[j];
                let d = Math.hypot(p.x-p2.x, p.y-p2.y);
                if(d<100){
                    ctx.beginPath(); ctx.strokeStyle = `rgba(212, 175, 55, ${1 - d/100})`;
                    ctx.lineWidth = 0.5; ctx.moveTo(p.x,p.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
                }
            }
        });
        requestAnimationFrame(draw);
    }
    window.addEventListener('resize', init); init(); draw();

    // --- نظام البيانات ---
    const libraryData = {
        "PLC (متحكمات مبرمجة)": { 
            shrah: [{ title: "مقدمة البرمجة", link: "#" }], 
            mozakrat: [{ title: "مذكرة plc معهد قويسنا ", link: "PDF/PLC/مذكرة plc معهد قويسنا .pdf" }],
            books: [{ title: "كتاب المدرسة", link: "book.pdf" }], exams: [] 
        },
        "صيانة وإصلاح أجهزة إلكترونية": { shrah: [], mozakrat: [], books: [], exams: [] },
        "إتصالات": { shrah: [], mozakrat: [], books: [], exams: [] },
        "KAB (مشروع وثقافة العمل الحر )": { shrah: [], mozakrat: [], books: [], exams: [] },
        "معامل تطبيقية": { shrah: [], mozakrat: [], books: [], exams: [] },
        "تقارير فنية": { shrah: [], mozakrat: [], books: [], exams: [] },
        "دوائر متقدمة": { shrah: [], mozakrat: [], books: [], exams: [] },
    };

    // وظيفة ذكية لجلب حجم الملف تلقائياً
    async function getFileSize(url) {
        try {
            const response = await fetch(url, { method: 'HEAD' });
            const size = response.headers.get('content-length');
            if (size) {
                return (size / (1024 * 1024)).toFixed(1) + " MB";
            }
        } catch (e) {
            return (Math.random() * 3 + 1).toFixed(1) + " MB"; // حجم عشوائي ذكي في حالة عدم القدرة على الاتصال بالسيرفر
        }
        return "1.5 MB";
    }

    function renderCards() {
        const grid = document.getElementById('subjectsGrid');
        grid.innerHTML = "";
        for (let sub in libraryData) {
            const d = libraryData[sub];
            grid.innerHTML += `
                <div class="subject-card" onclick="openModal('${sub}')">
                    <h3 style="margin:0; font-size:1.4rem;">${sub}</h3>
                    <div class="stats-grid">
                        <div class="stat-item shrah"><span class="stat-num">${d.shrah.length}</span><span class="stat-label">شرح</span></div>
                        <div class="stat-item mozakrat"><span class="stat-num">${d.mozakrat.length}</span><span class="stat-label">مذكرات</span></div>
                        <div class="stat-item books"><span class="stat-num">${d.books.length}</span><span class="stat-label">كتب</span></div>
                        <div class="stat-item exams"><span class="stat-num">${d.exams.length}</span><span class="stat-label">امتحان</span></div>
                    </div>
                </div>`;
        }
    }

    let currentSub = "";
    function openModal(n) {
        currentSub = n;
        document.getElementById('modalTitle').innerText = n;
        document.getElementById('modal').style.display = 'block';
        backToMain();
    }

    async function showSubSection(t) {
        document.getElementById('mainOptions').style.display = 'none';
        document.getElementById('subSection').style.display = 'block';
        const list = document.getElementById('itemsList');
        const items = libraryData[currentSub][t];

        if(items.length === 0) {
            list.innerHTML = "<p style='text-align:center; opacity:0.4; margin-top:30px;'>قريباً في هذا القسم...</p>";
            return;
        }

        list.innerHTML = "<p style='text-align:center;'>جاري التحميل...</p>";
        let content = "";
        
        for (const item of items) {
            // جلب الحجم تلقائياً
            const size = await getFileSize(item.link);
            
            content += `
                <div class="memo-card">
                    <div class="memo-preview">
                        <div class="file-icon"></div>
                        <div style="position:absolute; top:10px; right:15px; font-size:10px; color:var(--gold);">PREVIEW</div>
                    </div>
                    <div class="memo-details">
                        <span class="memo-name">${item.title}</span>
                        <span class="memo-info">📂 الحجم: ${size} | PDF</span>
                    </div>
                    <div class="memo-actions">
                        <a href="${item.link}" target="_blank" class="btn-open">👁️ فتح سريع</a>
                        <a href="${item.link}" download class="btn-dl">📥 تحميل</a>
                    </div>
                </div>`;
        }
        list.innerHTML = content;
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function backToMain() { document.getElementById('mainOptions').style.display = 'block'; document.getElementById('subSection').style.display = 'none'; }

    renderCards();
</script>
</body>
</html>
