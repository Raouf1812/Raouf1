<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة أجهزة - الاحترافية</title>
    <link rel="icon" href="IMG/RR.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --clr-shrah: rgb(255, 79, 79);
            --clr-mozakrat: rgb(97, 255, 76);
            --clr-books: #fcff32;
            --clr-exams: #b5ffdf;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: #fff; margin: 0; overflow-x: hidden;
            min-height: 100vh;
        }

        /* حاوية الخلفية التقنية */
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: #000;
        }

        header { padding: 40px 20px; position: relative; z-index: 10; }

        .header-container {
            display: flex; align-items: center; justify-content: center;
            gap: 20px; padding: 10px;
        }

        .main-logo {
            width: 100px; height: auto;
            filter: drop-shadow(0 0 15px var(--gold-glow));
            border-radius: 50%;
        }

        .header-text { text-align: right; }
        header h1 { 
            font-size: 2.5rem; margin: 0; font-weight: 900;
            color: #fff; text-shadow: 0 0 10px var(--gold-glow);
        }
        header p { margin: 5px 0 0; opacity: 0.8; font-size: 1rem; color: var(--gold); }

        .container { padding: 15px; max-width: 450px; margin: auto; position: relative; z-index: 10; }

        /* الكروت الشفافة Glassmorphism */
        .subject-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 30px; padding: 20px; margin-bottom: 20px;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            transition: 0.3s; cursor: pointer;
        }
        .subject-card:hover { border-color: var(--gold); transform: translateY(-5px); }

        .card-header h3 { font-size: 1.4rem; margin: 0 0 15px; color: #fff; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-item { 
            padding: 10px; border-radius: 15px; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; align-items: center;
        }
        .stat-num { font-size: 1.5rem; font-weight: 900; }
        .stat-label { font-size: 0.7rem; opacity: 0.6; }

        /* المودال */
        .modal { 
            display: none; position: fixed; inset: 0; z-index: 9999; 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
            overflow-y: auto;
        }
        .modal-content { padding: 30px; max-width: 500px; margin: auto; }
        .btn-luxury {
            width: 100%; padding: 30px; margin-bottom: 10px; border-radius: 20px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(212, 175, 55, 0.2); 
            color: #fff; font-weight: 700; display: flex; justify-content: space-between; 
            align-items: center; cursor: pointer; font-family: 'Cairo';
        }
        .item-card {
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 20px;
            margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05);
        }
        .action-btns { display: flex; gap: 10px; margin-top: 10px; }
        .view-btn, .download-btn { flex: 1; padding: 10px; border-radius: 10px; text-decoration: none; font-weight: 700; text-align: center; font-size: 0.8rem; }
        .view-btn { background: #fff; color: #000; }
        .download-btn { background: var(--gold); color: #000; }
        .close-btn { font-size: 30px; color: var(--gold); cursor: pointer; float: left; }

        .shrah { color: var(--clr-shrah); }
        .mozakrat { color: var(--clr-mozakrat); }
        .books { color: var(--clr-books); }
        .exams { color: var(--clr-exams); }
    </style>
</head>
<body>

    <canvas id="bgCanvas" style="position:fixed; top:0; left:0; z-index:-1;"></canvas>

    <header>
        <div class="header-container">
            <img src="IMG/RR.png" alt="Logo" class="main-logo">
            <div class="header-text">
                <h1>مكتبة أجهزة</h1>
                <p>الصف الثاني - الترم الثاني</p>
            </div>
        </div>
    </header>

    <div class="container" id="subjectsGrid"></div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">✕</span>
            <h2 id="modalTitle" style="color: var(--gold); margin: 30px 0;"></h2>
            <div id="mainOptions">
                <button class="btn-luxury" onclick="showSubSection('shrah')">🎬 فيديوهات الشرح <span class="shrah">❯</span></button>
                <button class="btn-luxury" onclick="showSubSection('mozakrat')">📜 المذكرات <span class="mozakrat">❯</span></button>
                <button class="btn-luxury" onclick="showSubSection('books')">📚 الكتب <span class="books">❯</span></button>
                <button class="btn-luxury" onclick="showSubSection('exams')">✍️ امتحانات <span class="exams">❯</span></button>
            </div>
            <div id="subSection" style="display: none;">
                <button class="btn-luxury" onclick="backToMain()" style="background: var(--gold); color: #000;">🔙 رجوع</button>
                <div id="itemsList"></div>
            </div>
        </div>
    </div>

    <script>
        // --- نظام محاكاة السائل والجيروسكوب ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let angle = 0; // زاوية ميل الموبايل
        let points = [];
        const numPoints = 15; // دقة موجة السائل

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            points = [];
            for (let i = 0; i <= numPoints; i++) {
                points.push({
                    x: (width / numPoints) * i,
                    y: height * 0.75, // ربع الشاشة من الأسفل
                    targetY: height * 0.75
                });
            }
        }

        // قراءة الجيروسكوب
        window.addEventListener('deviceorientation', (event) => {
            if (event.gamma) {
                // تقييد الزاوية لتبدو طبيعية (من -30 إلى 30 درجة)
                angle = Math.max(-30, Math.min(30, event.gamma)) * (Math.PI / 180);
            }
        });

        // نظام النقط الذهبية الساقطة (Rain)
        const particles = [];
        function createParticle() {
            return {
                x: Math.random() * width,
                y: -20,
                speed: Math.random() * 5 + 2,
                size: Math.random() * 2 + 1
            };
        }

        function draw() {
    // تنظيف الكانفاس بأسود عميق
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);

    // 1. رسم النقط الذهبية (تأثير المطر المتوهج)
    if (Math.random() > 0.9) particles.push(createParticle());
    
    // إعداد التوهج للنقط
    ctx.shadowBlur = 15;
    ctx.shadowColor = "rgba(212, 175, 55, 0.8)";
    ctx.fillStyle = 'rgba(212, 175, 55, 0.5)'; // جعل النقط شفافة قليلاً

    particles.forEach((p, i) => {
        p.y += p.speed;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        if (p.y > height) particles.splice(i, 1);
    });
    
    // إيقاف التوهج لباقي العناصر لضمان الأداء
    ctx.shadowBlur = 0;

    // 2. رسم السائل الذهبي (الواقعي والشفاف)
    ctx.beginPath();
    ctx.moveTo(0, height);

    const time = Date.now() * 0.002;
    const tiltOffset = Math.tan(angle) * (width / 2);

    // نقطة البداية للموجة
    ctx.lineTo(0, points[0].y + tiltOffset);
    
    for (let i = 0; i < points.length - 1; i++) {
        const p = points[i];
        const nextP = points[i+1];
        const wave = Math.sin(time + (i * 0.4)) * 8; // موجة أعمق قليلاً
        
        const ctrlX = (p.x + nextP.x) / 2;
        const ctrlY = (p.y + nextP.y) / 2 + wave + tiltOffset * ((i - numPoints/2) / (numPoints/2));
        
        ctx.quadraticCurveTo(p.x, p.y + wave + (tiltOffset * ((i - numPoints/2) / (numPoints/2))), ctrlX, ctrlY);
    }

    ctx.lineTo(width, height * 0.75 - tiltOffset);
    ctx.lineTo(width, height);
    
    // --- التدرج اللوني للسائل (شفاف وراقي) ---
    const grd = ctx.createLinearGradient(0, height * 0.65, 0, height);
    grd.addColorStop(0, "rgba(212, 175, 55, 0.2)");   // قمة السائل شفافة جداً
    grd.addColorStop(0.3, "rgba(212, 175, 55, 0.15)"); // تلاشي في المنتصف
    grd.addColorStop(1, "rgba(184, 134, 11, 0.05)");  // شفافية شبه تامة في القاع

    ctx.fillStyle = grd;
    ctx.fill();

    // --- إضافة "اللمعة" على حافة السائل (هذا ما يجعله واقعياً) ---
    ctx.strokeStyle = "rgba(255, 255, 255, 0.25)"; // خط أبيض شفاف جداً كأنه انعكاس ضوء
    ctx.lineWidth = 1.5;
    ctx.stroke();

    requestAnimationFrame(draw);
}

        window.addEventListener('resize', initCanvas);
        initCanvas();
        draw();

        // --- نظام البيانات والمودال (كودك الأصلي مع تحسين) ---
        const libraryData = {
            "PLC (متحكمات مبرمجة)": { 
                shrah: [{ title: "شرح الفيديو الأول", link: "videos/plc1.mp4" }], 
                mozakrat: [{ title: "مذكرة الباب الأول", link: "notes/test.pdf" }],
                books: [], exams: [] 
            },
            "KAB (مشروع وثقافة العمل الحر )": { shrah: [], mozakrat: [], books: [], exams: [] },
            "صيانة وإصلاح أجهزة إلكترونية": { shrah: [], mozakrat: [], books: [], exams: [] },
            "إتصالات ": { shrah: [], mozakrat: [], books: [], exams: [] },
            "معامل تطبيقية": { shrah: [], mozakrat: [], books: [], exams: [] },
            "تقارير فنية": { shrah: [], mozakrat: [], books: [], exams: [] },
            "دوائر الكترونية متقدمة": { shrah: [], mozakrat: [], books: [], exams: [] },
        };

        function renderCards() {
            const grid = document.getElementById('subjectsGrid');
            grid.innerHTML = "";
            for (let sub in libraryData) {
                const d = libraryData[sub];
                const card = document.createElement('div');
                card.className = 'subject-card';
                card.innerHTML = `
                    <div class="card-header"><h3>${sub}</h3></div>
                    <div class="stats-grid">
                        <div class="stat-item shrah"><span class="stat-num">${d.shrah.length}</span><span class="stat-label">شرح</span></div>
                        <div class="stat-item mozakrat"><span class="stat-num">${d.mozakrat.length}</span><span class="stat-label">مذكرات</span></div>
                        <div class="stat-item books"><span class="stat-num">${d.books.length}</span><span class="stat-label">كتب</span></div>
                        <div class="stat-item exams"><span class="stat-num">${d.exams.length}</span><span class="stat-label">امتحان</span></div>
                    </div>`;
                card.onclick = () => openModal(sub);
                grid.appendChild(card);
            }
        }

        let currentSub = "";
        function openModal(n) {
            currentSub = n;
            document.getElementById('modalTitle').innerText = n;
            document.getElementById('modal').style.display = 'block';
            backToMain();
        }

        function showSubSection(t) {
            document.getElementById('mainOptions').style.display = 'none';
            document.getElementById('subSection').style.display = 'block';
            const list = document.getElementById('itemsList');
            const items = libraryData[currentSub][t];
            list.innerHTML = items.length === 0 ? "<p style='text-align:center; opacity:0.5;'>قريباً...</p>" : "";
            items.forEach(i => {
                list.innerHTML += `
                    <div class="item-card">
                        <b>${i.title}</b>
                        <div class="action-btns">
                            <a href="${i.link}" target="_blank" class="view-btn">👁️ عرض</a>
                            <a href="${i.link}" target="_blank" class="download-btn">📥 تحميل</a>
                        </div>
                    </div>`;
            });
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function backToMain() { document.getElementById('mainOptions').style.display = 'block'; document.getElementById('subSection').style.display = 'none'; }

        renderCards();
    </script>
</body>
</html>
