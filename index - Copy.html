<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الشيتات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050608; 
            --accent: #ffd700; 
            --card: #11141a; 
        }
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background: var(--bg); 
            color: #fff; 
            margin: 0; padding: 0; 
            text-align: center;
        }

        .light-rope {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 3px;
            background: #222;
            z-index: 2000;
            display: flex;
            justify-content: space-around;
        }
        .bulb {
            width: 6px; height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: blink 1.5s infinite alternate;
        }
        @keyframes blink { from { opacity: 0.2; } to { opacity: 1; box-shadow: 0 0 10px var(--accent); } }

        .real-fanous {
            position: absolute;
            top: 0;
            width: 80px; 
            z-index: 1000;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
            animation: swing 4s infinite ease-in-out;
            transform-origin: top center;
        }
        .chain {
            position: absolute;
            top: 0;
            width: 2px;
            height: 40px;
            background: linear-gradient(to bottom, #444, #ffd700);
            z-index: 999;
        }

        @keyframes swing {
            0% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
            100% { transform: rotate(-5deg); }
        }

        header { padding: 100px 0 30px; position: relative; }
        header h1 { font-size: 45px; font-weight: 900; color: var(--accent); margin: 0; }

        .grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
            max-width: 600px; margin: 0 auto; padding: 20px;
        }

        .card { 
            background: var(--card); padding: 25px 15px; 
            border-radius: 20px; border: 1px solid rgba(255,215,0,0.1); 
            cursor: pointer; font-weight: 700; transition: 0.3s;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .sheet-item { 
            background: #161b22; margin: 12px auto; padding: 20px; 
            border-radius: 15px; display: flex; justify-content: space-between; 
            border-right: 5px solid var(--accent); cursor: pointer; max-width: 500px;
            align-items: center;
        }

        #viewer { 
            display:none; position:fixed; inset:0; 
            background:rgba(0,0,0,0.97); z-index:9999; 
            align-items:center; justify-content:center; flex-direction: column; 
        }
        #viewer img { max-width: 90%; max-height: 80%; border: 2px solid var(--accent); border-radius: 20px; }
        
        .close-btn { 
            margin-top: 25px; padding: 15px 60px; 
            background: var(--accent); color: #000; 
            border-radius: 40px; font-weight: 900; cursor: pointer; 
        }

        #music-btn {
            position: fixed; bottom: 25px; left: 25px;
            background: #1c222d; color: var(--accent); border: 1px solid var(--accent);
            padding: 12px 22px; border-radius: 35px;
            cursor: pointer; font-size: 15px; font-weight: bold; z-index: 1001;
            display: flex; align-items: center; gap: 10px;
        }

        footer { margin-top: 100px; padding: 50px; border-top: 1px solid rgba(255,215,0,0.1); }
        .footer-name { color: var(--accent); font-weight: 900; font-size: 22px; }
    </style>
</head>
<body>

    <div class="light-rope" id="rope"></div>

    <header>
        <div style="position: absolute; right: 10%; top: 0; display: flex; flex-direction: column; align-items: center;">
            <div class="chain"></div>
            <img src="RR/pngegg.png" class="real-fanous" alt="fanous">
        </div>
        <div style="position: absolute; left: 10%; top: 0; display: flex; flex-direction: column; align-items: center;">
            <div class="chain"></div>
            <img src="RR/pngegg.png" class="real-fanous" alt="fanous">
        </div>
        <h1>صفحة الشيتات</h1>
        <p style="color: var(--accent);">🌙 رَمَضَان كَرِيم 🌙</p>
    </header>

    <div class="grid">
        <div class="card" onclick="loadSheets('plc')">PLC (متحكمات)</div>
        <div class="card" onclick="loadSheets('صيانة')">صيانة أجهزة</div>
        <div class="card" onclick="loadSheets('اتصالات')">إتصالات</div>
        <div class="card" onclick="loadSheets('KAB')">KAB (العمل الحر)</div>
        <div class="card" onclick="loadSheets('معامل')">معامل تطبيقية</div>
        <div class="card" onclick="loadSheets('تقارير')">تقارير فنية</div>
        <div class="card" onclick="loadSheets('دوائر')">دوائر متقدمة</div>
    </div>

    <div id="content"></div>

    <div id="viewer">
        <img id="vImg" src="">
        <div class="close-btn" onclick="closeViewer()">إغلاق</div>
    </div>

    <button id="music-btn" onclick="toggleMusic()">
        <span id="music-text">تشغيل</span> 🎵
    </button>
    <audio id="ramadan-audio" loop>
        <source src="RR/11.mp3" type="audio/mpeg">
    </audio>

    <footer>
        <p style="opacity: 0.6; margin: 0;">تَمَّ التَّصْمِيمُ بِوَاسِطَةِ</p>
        <div class="footer-name"> - RAOUF - </div>
    </footer>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // تعديل مستويات المؤثرات الصوتية (وطيتها جداً)
        function playInteractionSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime); // توطية الصوت لـ 2%
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            } else if (type === 'open') {
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime); // توطية الصوت لـ 2%
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            }
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        const rope = document.getElementById('rope');
        for(let i=0; i<25; i++) {
            const bulb = document.createElement('div');
            bulb.className = 'bulb';
            bulb.style.animationDelay = (i * 0.15) + 's';
            rope.appendChild(bulb);
        }

        const allData = [
            { name: "شيت رقم 1", date: "2026-02-01", sub: "plc", url: "RR/pngegg.png" },
        ];

        function loadSheets(sub) {
            playInteractionSound('click');
            const container = document.getElementById('content');
            container.innerHTML = `<h2 style="color:var(--accent); margin-top:40px;">📂 شيتات ${sub}</h2>`;
            const filtered = allData.filter(i => i.sub === sub);
            
            if (filtered.length === 0) {
                container.innerHTML += "<p style='opacity:0.4; margin-top:20px;'>لا توجد ملفات حالياً</p>";
                return;
            }

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'sheet-item';
                div.innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 5px; flex:1;" onclick="viewImg('${item.url}')">
                        <span style="font-weight: 900; color: #fff;">${item.name}</span>
                        <span style="font-size: 12px; opacity: 0.6;">📅 التاريخ: ${item.date}</span>
                    </div>
                    <div style="display: flex; gap: 15px;">
                        <span style="color:var(--accent); font-weight:bold; cursor:pointer;" onclick="viewImg('${item.url}')">عرض 👁️</span>
                        <a href="${item.url}" download="${item.name}" style="text-decoration:none; color:#00ff88; font-weight:bold;">تحميل 📥</a>
                    </div>
                `;
                container.appendChild(div);
            });
            window.scrollTo({ top: container.offsetTop - 50, behavior: 'smooth' });
        }

        function viewImg(url) {
            playInteractionSound('open');
            document.getElementById('viewer').style.display = 'flex';
            document.getElementById('vImg').src = url;
        }

        function closeViewer() {
            playInteractionSound('click');
            document.getElementById('viewer').style.display = 'none';
        }

        const audio = document.getElementById('ramadan-audio');
        audio.volume = 0.08; // رفع صوت الخلفية لـ 8%
        
        function toggleMusic() {
            playInteractionSound('click');
            const btn = document.getElementById('music-btn');
            if (audio.paused) { 
                audio.play(); 
                btn.innerHTML = '<span id="music-text">إيقاف</span> 🔇';
            } else { 
                audio.pause(); 
                btn.innerHTML = '<span id="music-text">تشغيل</span> 🎵';
            }
        }
    </script>
</body>
</html>
