<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | إدارة المكتبة</title>
    <style>
        :root { --gold: #a8cad7; --bg: #050505; --box-bg: #111; --drive-blue: #1a73e8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--gold); font-family: 'Segoe UI', Tahoma, sans-serif; padding: 10px; }
        
        .drive-toolbar {
            background: #1a1a1a; border: 1px dashed var(--gold);
            padding: 15px; border-radius: 12px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .drive-btn {
            background: var(--drive-blue); color: white; padding: 10px 15px;
            border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px;
            display: flex; align-items: center; gap: 8px;
        }

        .container { width: 100%; max-width: 600px; margin: 0 auto; }
        .box { background: var(--box-bg); border: 2px solid var(--gold); padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h2 { text-align: center; color: #fff; margin-bottom: 5px; font-size: 1.3rem; }
        h4 { text-align: center; color: var(--gold); margin-bottom: 20px; opacity: 0.8; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; font-size: 0.9rem; color: #fff; }
        
        input, select, button { 
            width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; 
            border: 1px solid #333; background: #222; color: #fff; font-size: 16px; 
        }
        
        .btn-save { background: var(--gold); color: #000; font-weight: 900; cursor: pointer; border: none; font-size: 18px; transition: 0.3s; margin-top: 10px; }
        .btn-save:hover { background: #fff; }
        
        #status { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; display: none; font-weight: bold; }
        .success { background: rgba(0, 242, 96, 0.1); color: #00f260; border: 1px solid #00f260; }
        small { color: #888; font-size: 11px; display: block; margin-top: -8px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="drive-toolbar">
        <span style="font-size: 14px;">ارفع الملف وهات الرابط:</span>
        <a href="https://drive.google.com/drive/u/0/my-drive" target="_blank" class="drive-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/12/Google_Drive_icon_%282020%29.svg" width="18">
            فتح Google Drive
        </a>
    </div>

    <div class="box">
        <h2>بحبك يابنونتي 😘</h2>
        <h5>🛠️ إضافة مادة للمكتبة</h5>
        
        <label>اختر المادة:</label>
        <select id="subject">
            <option value="PLC (متحكمات مبرمجة)">PLC (متحكمات مبرمجة)</option>
            <option value="صيانة وإصلاح أجهزة إلكترونية">صيانة وإصلاح أجهزة إلكترونية</option>
            <option value="إتصالات">إتصالات</option>
            <option value="KAB (مشروع وثقافة العمل الحر)">KAB (مشروع وثقافة العمل الحر)</option>
            <option value="معامل تطبيقية">معامل تطبيقية</option>
            <option value="تقارير فنية">تقارير فنية</option>
            <option value="دوائر متقدمة">دوائر متقدمة</option>
        </select>

        <label>قسم الملف:</label>
        <select id="category">
            <option value="mozakrat">مذكرات</option>
            <option value="shrah">فيديوهات شرح (YouTube)</option>
            <option value="books">كتب الوزارة</option>
            <option value="exams">امتحانات</option>
            <option value="solved">امتحانات محلولة</option>
        </select>

        <label>اسم الملف:</label>
        <input type="text" id="name" placeholder="مثال: ملخص الباب الأول">

        <label>حجم الملف (اختياري):</label>
        <input type="text" id="size" placeholder="مثال: 5MB أو 10MB">
        <small>* لو سيبتها فاضية هيكتب Drive 💾 تلقائياً.</small>

        <label>رابط الملف (درايف أو يوتيوب):</label>
        <input type="text" id="link" placeholder="انسخ الرابط هنا">
        <small>* روابط الدرايف تتحول لروابط تحميل مباشرة تلقائياً.</small>

        <button class="btn-save" onclick="saveData()">✅ إضافة وتنزيل data.js</button>
        <div id="status"></div>
    </div>
</div>

<script src="data.js"></script>
<script>
function getDriveIDs(url) {
    let id = "";
    if (url.includes('/d/')) id = url.split('/d/')[1].split('/')[0];
    else if (url.includes('id=')) id = url.split('id=')[1].split('&')[0];
    
    return {
        view: `https://drive.google.com/file/d/${id}/view`,
        download: `https://drive.google.com/uc?export=download&id=${id}`
    };
}

function saveData() {
    const sub = document.getElementById('subject').value;
    const cat = document.getElementById('category').value;
    const name = document.getElementById('name').value;
    const size = document.getElementById('size').value;
    let link = document.getElementById('link').value;
    const status = document.getElementById('status');

    if (!name || !link) { alert("أكمل البيانات يا هندسة!"); return; }

    let finalLink = link;
    if (link.includes('drive.google.com')) {
        const ids = getDriveIDs(link);
        finalLink = ids.download; 
    }

    if (!libraryData[sub]) libraryData[sub] = {};
    if (!libraryData[sub][cat]) libraryData[sub][cat] = [];

    // إضافة البيانات للملف
    libraryData[sub][cat].push({
        id: Date.now().toString(),
        name: name,
        link: finalLink,
        size: size || "Drive 💾" // لو فاضي يحط كلمة درايف
    });

    // إنشاء وحفظ الملف
    const finalContent = "var libraryData = " + JSON.stringify(libraryData, null, 4) + ";";
    const blob = new Blob([finalContent], { type: 'text/javascript;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'data.js';
    a.click();

    status.style.display = 'block';
    status.className = 'success';
    status.innerHTML = "✅ تمت الإضافة! نزل الملف وارفع الـ data.js الجديد.";
}
</script>
</body>
</html>
