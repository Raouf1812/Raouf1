<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الشيتات - رمضان كريم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --gold: #a8cad7;
            --gold-glow: rgba(168, 202, 215, 0.3);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --ramadan-gold: #FFD700;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: #fff;
            margin: 0; padding: 0;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(168, 202, 215, 0.07) 0%, transparent 35%),
                radial-gradient(circle at 90% 90%, rgba(168, 202, 215, 0.07) 0%, transparent 35%);
            background-attachment: fixed;
        }

        /* Ramadan Header */
        .ramadan-header {
            padding: 25px 20px 15px;
            text-align: center;
            background: linear-gradient(180deg, rgba(107, 70, 193, 0.15) 0%, transparent 100%);
        }

        .ramadan-greeting {
            font-size: 26px;
            font-weight: 900;
            color: var(--ramadan-gold);
            text-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
            margin: 0;
        }

        /* Stars decoration */
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--ramadan-gold);
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
            box-shadow: 0 0 10px var(--ramadan-gold);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* Hanging Lantern */
        .lantern-container {
            position: absolute;
            top: 20px;
            right: 25%;
            pointer-events: none;
            z-index: 1000;
        }

        .lantern {
            width: 60px;
            height: 85px;
            animation: swing 3.5s ease-in-out infinite;
            transform-origin: top center;
        }

        .lantern::before {
            content: '';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 30px;
            background: linear-gradient(180deg, rgba(255, 215, 0, 0.3), rgba(255, 215, 0, 0.7));
        }

        .lantern-top {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 12px;
            background: linear-gradient(180deg, #FFD700, #FFA500);
            border-radius: 6px 6px 0 0;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.5);
        }

        .lantern-top::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 2px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 2px;
        }

        .lantern-body {
            width: 60px;
            height: 70px;
            background: linear-gradient(135deg, #FFD700 0%, #FF6B6B 50%, #C41E3A 100%);
            border-radius: 15px;
            position: relative;
            margin-top: 12px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 215, 0, 0.9);
            overflow: hidden;
        }

        .lantern-body::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            height: 25px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .lantern-body::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, rgba(255, 255, 100, 0.9) 0%, rgba(255, 200, 0, 0.6) 50%, transparent 70%);
            border-radius: 50%;
            animation: candleFlame 1.5s ease-in-out infinite;
        }

        @keyframes candleFlame {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
            50% { transform: translateX(-50%) scale(1.1, 0.95); opacity: 0.8; }
        }

        .lantern-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 8px,
                rgba(0, 0, 0, 0.15) 8px,
                rgba(0, 0, 0, 0.15) 10px
            );
        }

        .lantern-bottom {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 18px solid #C41E3A;
            filter: drop-shadow(0 0 10px rgba(255, 107, 107, 0.6));
        }

        .lantern-bottom::after {
            content: '';
            position: absolute;
            top: -15px;
            left: -12px;
            width: 24px;
            height: 3px;
            background: #FFD700;
            border-radius: 2px;
        }

        .lantern-light {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.9) 0%, rgba(255, 200, 0, 0.4) 40%, transparent 70%);
            border-radius: 50%;
            animation: flicker 2.5s ease-in-out infinite;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-6deg); }
            50% { transform: rotate(6deg); }
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
            25% { opacity: 0.85; }
            50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
            75% { opacity: 0.9; }
        }

        /* Music Control Button */
        .music-control {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #6B46C1 0%, var(--ramadan-gold) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(107, 70, 193, 0.4);
            transition: transform 0.2s;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .music-control:hover {
            transform: scale(1.1);
        }

        .music-control svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        #toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: var(--gold); color: #050505; padding: 14px 30px;
            border-radius: 15px; font-weight: 700; z-index: 10000;
            transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        #toast.show { top: 30px; }

        header { padding: 60px 20px 40px; text-align: center; }
        header h1 { 
            font-size: 42px; font-weight: 900; color: var(--gold); 
            margin: 0; text-shadow: 0 0 20px var(--gold-glow);
        }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; 
            padding: 10px 25px; background: var(--glass); color: #fff; 
            text-decoration: none; border-radius: 12px; border: 1px solid var(--glass-border);
            font-size: 14px; transition: 0.4s; backdrop-filter: blur(10px);
        }
        .back-btn:hover { background: var(--gold); color: #000; transform: translateY(-3px); }

        .cards-list {
            max-width: 600px; margin: 20px auto; padding: 0 20px;
            display: flex; flex-direction: column; gap: 18px;
        }

        .card {
            background: var(--glass); padding: 25px; border-radius: 24px;
            border: 1px solid var(--glass-border); backdrop-filter: blur(20px);
            cursor: pointer; transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex; justify-content: space-between; align-items: center;
            position: relative; overflow: hidden;
        }
        
        .card:hover {
            border-color: var(--ramadan-gold); transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .sub-info h3 { margin: 0; font-size: 20px; font-weight: 700; }
        .sub-info p { margin: 6px 0 0; font-size: 13px; color: var(--gold); opacity: 0.7; }

        .badge {
            background: rgba(255, 215, 0, 0.15); color: var(--ramadan-gold); 
            padding: 6px 15px; border-radius: 10px; font-size: 12px; font-weight: 800;
        }

        #content { max-width: 600px; margin: 50px auto; padding: 0 20px; }
        .sheet-item {
            background: rgba(255,255,255,0.02); margin-bottom: 15px; padding: 20px;
            border-radius: 20px; display: flex; justify-content: space-between;
            align-items: center; border-right: 5px solid var(--gold);
            transition: 0.3s;
        }

        .btn-group { display: flex; gap: 10px; }
        .btn { 
            width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; text-decoration: none; cursor: pointer; transition: 0.3s;
        }
        .btn-view { border: 1px solid var(--gold); color: var(--gold); }
        .btn-down { background: var(--gold); color: #000; }

        #viewer { 
            display:none; position:fixed; inset:0; background:rgba(0,0,0,0.98); 
            z-index:10000; align-items:center; justify-content:center;
            backdrop-filter: blur(10px);
        }
        #viewer img { max-width: 90%; max-height: 80%; border-radius: 20px; border: 1px solid var(--glass-border); }
        .close-v { 
            position: absolute; top: 30px; right: 30px; width: 50px; height: 50px;
            background: #ff4757; color: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer;
        }

        footer { padding: 80px 20px; text-align: center; font-weight: 900; letter-spacing: 5px; color: var(--gold); opacity: 0.3; }

        @media (max-width: 768px) {
            .ramadan-greeting { font-size: 20px; }
            .music-control { width: 50px; height: 50px; bottom: 20px; left: 20px; }
            .music-control svg { width: 22px; height: 22px; }
            .lantern-container { right: 10%; }
            .lantern { width: 45px; height: 65px; }
            .lantern-body { width: 45px; height: 55px; }
            .lantern-top { width: 35px; height: 10px; }
        }
    </style>
</head>
<body>

    <!-- Stars decoration -->
    <div class="stars" id="stars"></div>

    <!-- Hanging Lantern -->
    <div class="lantern-container">
        <div class="lantern">
            <div class="lantern-top"></div>
            <div class="lantern-body">
                <div class="lantern-pattern"></div>
                <div class="lantern-light"></div>
            </div>
            <div class="lantern-bottom"></div>
        </div>
    </div>

    <!-- Music Control -->
    <div class="music-control" id="musicBtn" onclick="toggleMusic()">
        <svg id="playIcon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;">
            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
        </svg>
    </div>

    <!-- Audio Element -->
    <audio id="ramadanMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="ramadan-header">
        <div class="ramadan-greeting">🌙 رمضان كريم 🌙</div>
    </div>

    <div id="toast">🔥 بدأ التحميل..</div>

    <header data-aos="zoom-in">
        <h1 onclick="location.href='admin - 2.html'" style="cursor: pointer;">صفحة الشيتات</h1>
        <a href="index.html" class="back-btn">🏠 العودة للمكتبة الرئيسية</a>
    </header>

    <div class="cards-list" id="main-list"></div>
    <div id="content"></div>

    <div id="viewer" onclick="closeViewer()">
        <div class="close-v">×</div>
        <img id="vImg" src="" onclick="event.stopPropagation()">
    </div>

    <footer>~ Raouf - رمضان كريم ~</footer>
    
    <script src="الشيتات.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        // Generate random stars
        function generateStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 50;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        // Music Control
        let isPlaying = false;
        const music = document.getElementById('ramadanMusic');
        const musicBtn = document.getElementById('musicBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            } else {
                music.play().catch(e => console.log('Audio play failed:', e));
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            }
            isPlaying = !isPlaying;
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function renderGrid() {
            const list = document.getElementById('main-list');
            list.innerHTML = '';
            subjects.forEach((s, index) => {
                const count = allData.filter(i => i.sub === s.key).length;
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-aos', 'fade-up');
                card.setAttribute('data-aos-delay', index * 50);
                card.onclick = () => loadSheets(s.key, s.label, s.eng);
                card.innerHTML = `
                    <div class="sub-info">
                        <h3>${s.label}</h3>
                        <p>👤 م: ${s.eng}</p>
                    </div>
                    <div class="badge">${count} ملفات</div>
                `;
                list.appendChild(card);
            });
        }

        function loadSheets(subKey, label, eng) {
            const container = document.getElementById('content');
            const filtered = allData.filter(i => i.sub === subKey);
            let html = `<h2 data-aos="fade-left" style="color:var(--ramadan-gold); margin-bottom:25px; font-size:24px;">📂 <span>${label}</span></h2>`;
            
            if (filtered.length === 0) {
                html += `<div data-aos="zoom-in" style='opacity:0.4; text-align:center; padding:40px; border:1px dashed var(--glass-border); border-radius:20px;'>لا توجد ملفات حالياً</div>`;
            } else {
                filtered.forEach((item, idx) => {
                    html += `
                        <div class="sheet-item" data-aos="fade-up" data-aos-delay="${idx*100}">
                            <div>
                                <div style="font-weight:700; font-size:17px; margin-bottom:4px;">${item.name}</div>
                                <div style="font-size:12px; opacity:0.6;">📅 ${item.date}</div>
                            </div>
                            <div class="btn-group">
                                <div class="btn btn-view" onclick="viewImg('${item.url}')">👁️</div>
                                <a href="${item.url}" download onclick="showToast()" class="btn btn-down">🔥</a>
                            </div>
                        </div>`;
                });
            }
            container.innerHTML = html;
            window.scrollTo({ top: container.offsetTop - 50, behavior: 'smooth' });
        }

        function viewImg(url) { 
            document.getElementById('viewer').style.display = 'flex'; 
            document.getElementById('vImg').src = url; 
            document.body.style.overflow = 'hidden';
        }
        
        function closeViewer() { 
            document.getElementById('viewer').style.display = 'none'; 
            document.body.style.overflow = 'auto';
        }

        // Initialize stars
        generateStars();
        renderGrid();
    </script>
</body>
</html>
