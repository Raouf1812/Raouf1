<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | تحديث تلقائي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0a; --gold: #a8cad7; --glass: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #lock-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .pass-card { background: var(--glass); padding: 40px; border-radius: 30px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 85%; max-width: 350px; }
        
        input, select, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: none; box-sizing: border-box; font-family: 'Cairo'; }
        input, select { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        button { background: var(--gold); color: #000; font-weight: 900; cursor: pointer; transition: 0.3s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .admin-container { width: 90%; max-width: 450px; padding: 30px; background: var(--glass); border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .status { margin-top: 15px; font-size: 14px; text-align: center; color: var(--gold); }
        /* تصميم دائرة التحميل */
.progress-container { display: none;  flex-direction: column; align-items: center; margin: 20px 0; }
.circular-progress { position: relative; height: 100px; width: 100px; border-radius: 50%; background: conic-gradient(var(--gold) 0deg, #333 0deg); display: flex; align-items: center; justify-content: center; transition: 0.3s; }
.circular-progress::before { content: ""; position: absolute; height: 84px; width: 84px; border-radius: 50%; background-color: #1a1a1a; }
.progress-value { position: relative; font-size: 18px; font-weight: 700; color: var(--gold); }
   
</style>
</head>
<body>

    <div id="lock-screen">
        <div class="pass-card">
            <h2 style="color: var(--gold);">🔒 الدخول للادمن فقط</h2>
            <input type="password" id="passInput" placeholder="كلمة السر">
            <button onclick="checkPass()">دخول</button>
        </div>
    </div>

    <div class="admin-container">
        <h2 style="text-align: center; color: var(--gold); margin-top: 0;">➕ إضافة شيت جديد</h2>
        
        <label>اسم الشيت</label>
        <input type="text" id="sheetName" placeholder="مثال: شيت رقم 1">

        <label>المادة</label>
        <select id="sheetSub"></select> <label>صورة الشيت</label>
        <input type="file" id="fileInput" accept="image/*">
        <div class="progress-container" id="progContainer">
            <div class="circular-progress" id="progCircle">
                <span class="progress-value" id="progValue">0%</span>
            </div>
            <p style="font-size: 12px; margin-top: 10px;">جاري معالجة ورفع الملف...</p>
        </div>
        <button id="uploadBtn" onclick="processAndDownload()">رفع وحفظ الملف الجديد</button>
        <div id="status" class="status"></div>
    </div>
    <script src="الشيتات.js"></script>
    <script>
        const SECRET_PASS = "Banan"; 

        function checkPass() {
            if(document.getElementById('passInput').value === SECRET_PASS) {
                document.getElementById('lock-screen').style.display = 'none';
                fillSubjects();
            } else { alert("خطأ!"); }
        }

        // ملء قائمة المواد من ملف الشيتات.js الأصلي
        function fillSubjects() {
            const select = document.getElementById('sheetSub');
            subjects.forEach(s => {
                let opt = document.createElement('option');
                opt.value = s.key;
                opt.innerHTML = s.label;
                select.appendChild(opt);
            });
        }

        async function processAndDownload() {
    const fileInput = document.getElementById('fileInput');
    const name = document.getElementById('sheetName').value;
    const sub = document.getElementById('sheetSub').value;
    const btn = document.getElementById('uploadBtn');
    const progContainer = document.getElementById('progContainer');
    const progCircle = document.getElementById('progCircle');
    const progValue = document.getElementById('progValue');

    if(!fileInput.files[0] || !name) return alert("يرجى إكمال البيانات");

    // إظهار الدائرة وتعطيل الزر
    btn.disabled = true;
    progContainer.style.display = 'flex';
    
    // محاكاة التقدم (تحريك الدائرة برمجياً)
    let progress = 0;
    let timer = setInterval(() => {
        if(progress < 90) { // ستتوقف عند 90% حتى ينتهي الرفع الفعلي
            progress++;
            progValue.innerText = `${progress}%`;
            progCircle.style.background = `conic-gradient(var(--gold) ${progress * 3.6}deg, #333 0deg)`;
        }
    }, 50);

    const apiKey = "5cbb6290de28740272d0af178e27ded0"; 
    const formData = new FormData();
    formData.append("image", fileInput.files[0]);

    try {
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
            method: "POST",
            body: formData
        });
        const resData = await response.json();
        const imageUrl = resData.data.url;

        // اكتمال الـ 100% عند نجاح الرفع
        clearInterval(timer);
        progValue.innerText = `100%`;
        progCircle.style.background = `conic-gradient(var(--gold) 360deg, #333 0deg)`;

        // إضافة البيانات وحفظ الملف
        const newSheet = { 
            name: name, 
            date: new Date().toISOString().split('T')[0], 
            sub: sub, 
            url: imageUrl 
        };
        allData.push(newSheet);

        const fileContent = `const subjects = ${JSON.stringify(subjects, null, 4)};\n\nconst allData = ${JSON.stringify(allData, null, 4)};`;
        
        setTimeout(() => {
            downloadFile(fileContent);
            alert("تم الرفع وتحميل الملف المحدث بنجاح!");
            progContainer.style.display = 'none';
            btn.disabled = false;
        }, 500);

    } catch (e) {
        clearInterval(timer);
        alert("حدث خطأ أثناء الرفع");
        progContainer.style.display = 'none';
        btn.disabled = false;
    }
}

        function downloadFile(content) {
            const blob = new Blob([content], { type: 'text/javascript' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'الشيتات.js'; // سيتم تحميله بنفس الاسم
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
